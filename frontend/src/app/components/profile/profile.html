<div class="container">
  <div class="container__card">
    <h3>Account Information</h3>
    <div class="profile-grid">
      <!-- Profile Picture Section -->
<div class="profile-picture-section">
  <img *ngIf="currentUser?.profile_picture" [src]="currentUser?.profile_picture" alt="Profile Picture" class="profile-picture">
  <div *ngIf="!currentUser?.profile_picture" class="profile-picture-placeholder">
    No Image
  </div>

  <!-- Pass the input element directly to the method -->
  <button class="btn" (click)="triggerFileInput(fileInput)">Change Picture</button>
  <input type="file" #fileInput (change)="changeProfilePicture($event)" accept="image/*" style="display:none" />
</div>


      <!-- User Information Section -->
      <div class="profile-details-section">
        <p><strong>ID:</strong> {{currentUser?.id}}</p>
        <p><strong>Username:</strong> {{currentUser?.name}}</p>
        <p><strong>Email:</strong> {{currentUser?.email}}</p>
        <p><strong>Role:</strong> {{currentUser?.role}}</p>
      </div>
    </div>

    <!-- Toggle Settings Button -->
    <button class="btn toggle-btn" (click)="showSettings = !showSettings">
      {{ showSettings ? 'Hide Settings' : 'Show Settings' }}
    </button>
  </div>

  <!-- Settings Container - Only shown when showSettings is true -->
  <div class="settings-container" *ngIf="showSettings">
    <!-- Change Username Section -->
    <div class="container__card settings-card">
      <h3>Change Username</h3>
      <div class="form-group">
        <label for="newUsername">New Username:</label>
        <input type="text" id="newUsername" #usernameInput>
      </div>
      <button class="btn" (click)="changeUsername(usernameInput.value); usernameInput.value=''">
        Update Username
      </button>
    </div>

    <!-- Change Email Section -->
    <div class="container__card settings-card">
      <h3>Change Email</h3>
      <div class="form-group">
        <label for="newEmail">New Email:</label>
        <input type="email" id="newEmail" #emailInput>
      </div>
      <button class="btn" (click)="changeEmail(emailInput.value); emailInput.value=''">
        Update Email
      </button>
    </div>

    <!-- Change Password Section -->
    <div class="container__card settings-card">
      <h3>Change Password</h3>
      <div class="form-group">
        <label for="newPassword">New Password:</label>
        <input type="password" id="newPassword" #passwordInput>
      </div>
      <button class="btn" (click)="changePassword(passwordInput.value); passwordInput.value=''">
        Update Password
      </button>
    </div>
  </div>
</div>
