<div class="payroll-container">

    <h2 class="title">Staff Payroll</h2>
  
    <!--Accounting Personnel: View ALL payrolls -->
    <div >
  
      <div *ngFor="let member of allStaff" class="staff-block">
  
        <div class="staff-info" style="flex-direction: row; display: flex; gap: 30px;">
          <p><strong>Name:</strong> {{ member.name }}</p>
          <p><strong>ID:</strong> {{ member.id }}</p>
          <p><strong>Email:</strong> {{ member.email }}</p>
        </div>
  
        <table class="payroll-table">
          <thead>
            <tr>
              <th>Month</th>
              <th>Base Salary</th>
              <th>Bonus</th>
              <th>Deductions</th>
              <th>Net Salary</th>
            </tr>
          </thead>
  
          <tbody>
            <tr *ngFor="let p of member.salary">
              <td>{{ p.month }}</td>
              <td>{{ p.baseSalary }} EGP</td>
              <td>{{ p.bonus }} EGP</td>
              <td>{{ p.deductions }} EGP</td>
              <td class="net">{{ calculateNet(p) }} EGP</td>
            </tr>
          </tbody>
        </table>

      </div>
            <form (ngSubmit)="addSalary()">
            <select name="month" [(ngModel)]="month">
              <option value=""disabled selected> Select a month...</option>
              <option value="January">January</option>
              <option value="February">February</option>
              <option value="March">March</option>
              <option value="April">April</option>
              <option value="May">May</option>
              <option value="June">June</option>
              <option value="July">July</option>
              <option value="August">August</option>
              <option value="September">September</option>
              <option value="October">October</option>
              <option value="November">November</option>
              <option value="December">December</option>
            </select>
            <input type="number" placeholder="Salary in EGP" [(ngModel)] = "salary" name="salary">
            <app-button type="submit" [text]="'Add Payroll'"></app-button>
          </form>
    </div>
  
    <!-- Staff: View ONLY their own payroll -->
    <div >
      <div class="staff-info">
        <p><strong>Name:</strong> hi</p>
      </div>
  
      <table class="payroll-table">
        <thead>
          <tr>
            <th>Month</th>
            <th>Base Salary</th>
            <th>Bonus</th>
            <th>Deductions</th>
            <th>Net Salary</th>
          </tr>
        </thead>
  
        <tbody>
          <!-- <tr *ngFor="let p of currentUser?.salary">
            <td>{{ p.month }}</td>
            <td>{{ p.baseSalary }} EGP</td>
            <td>{{ p.bonus }} EGP</td>
            <td>{{ p.deductions }} EGP</td>
            <td class="net">{{ calculateNet(p) }} EGP</td>
          </tr> -->
        </tbody>
      </table>
      <div style="text-align: center; margin-top: 50px;">
        <app-button (click)="exportDataToJson()" style="--btn-width: 200px" [text]="'Download Payroll Data'"> </app-button>
      </div>
    </div>
  
    <!-- Students: No access -->
    <!-- <h3 *ngIf="currentUser?.role === 'Student'" class="denied">
      You do not have permission to view payroll information.
    </h3> -->
  
</div>
