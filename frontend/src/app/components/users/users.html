
<div class="container" *ngIf="!loading">
<h1 class="container__title"> Users List</h1>
<table border="1" class="container__table">
  <thead>
    <tr>
      <th> ID</th>
      <th>Name</th>
      <th>Email</th>
      <th>Role</th>
      <th>Operation</th>
    </tr>
  </thead>
  <tbody *ngFor="let user of users">
    <tr>
      <td>{{user.id}}</td>
      <td>{{user.name}}</td>
      <td>{{user.email}}</td>
      <td>{{user.role}}</td>
      <td><button class="delete-button" (click)="deleteUser(user.id)">Delete</button></td>
    </tr>
  </tbody>
        </table>
    </div>
  <div *ngIf="loading" class="loading-container">
    <div class="spinner"></div>
  </div>
