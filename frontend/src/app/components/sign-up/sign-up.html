<div class="body">
    <div class="container">
        <h1 class="container__text">Register</h1>
        <form class="container__inputs" (ngSubmit)="onSubmit()">
            <input type="text" placeholder="Name" [(ngModel)]="name" name="name">
            <input type="email" placeholder="Email" [(ngModel)]="email" name="email">
            <input type="password" placeholder="Password" [(ngModel)]="password" name="password">
            <select name="Role" [(ngModel)]="role">
                <option value="" disabled selected>Select Role</option>
                <option value="Student"> Student</option>
                <option value="Admin"> Admin</option>
                <option value="Accounting Personnel"> Accounting Personnel</option>
                <option value="Staff"> Staff Member</option>
            </select>
            <input type="text" name="credit-card" id="" placeholder="Credit Card Number" [(ngModel)] = "creditNumber" minlength="16">
            <app-button [text]="'Submit'" [type]="'Submit'"></app-button>
        </form>
    </div>
</div>
