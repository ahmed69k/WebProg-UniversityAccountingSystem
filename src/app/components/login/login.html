<div class="body">
    <div class="container">
    <h1 class="container__text">Login</h1>
    <form class="container__inputs" (ngSubmit)="login()">
        <input type="email" placeholder="Email" [(ngModel)]="email" name="email">
        <input type="password" placeholder="Password" [(ngModel)]="password" name="password">
        <app-button [type]="'submit'" [text]="'Submit'"></app-button>
    </form>
</div>
</div>
